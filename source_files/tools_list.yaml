# tools_list.yaml - Optimized Enterprise CSR Toolset for BM25S Testing

documents:
  - id: "get_customer_profile"
    title: "Get Customer Profile"
    content: "Retrieve customer identity data, account status, and contact info."
    keywords: ["customer profile", "account identity", "user lookup", "contact information"]
    parameters:
      customer_id: { type: "string", description: "The unique identifier for the customer." }
    metadata:
      source: "yaml"
      category: "crm"
      provider: "internal"
      updated: "2025-04-07"

  - id: "get_customer_orders"
    title: "Get Customer Orders"
    content: "Fetch a list of all historical purchases and transaction history."
    keywords: ["order history", "purchase list", "transaction summary", "past orders"]
    parameters:
      customer_id: { type: "string", description: "ID of the customer whose orders are being retrieved." }
      status: { type: "string", enum: ["open", "closed", "all"], default: "all" }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "get_order_details"
    title: "Get Order Details"
    content: "Access line-item specifics and billing for a unique order ID."
    keywords: ["order breakdown", "sku details", "line items", "order info"]
    parameters:
      order_id: { type: "string", description: "The specific order tracking number or ID." }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "create_order"
    title: "Create Order"
    content: "Process a new sales transaction and generate a billable event."
    keywords: ["order creation", "new purchase", "checkout process", "place order"]
    parameters:
      customer_id: { type: "string" }
      product_id: { type: "string" }
      quantity: { type: "integer", minimum: 1 }
      price: { type: "number" }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "cancel_order"
    title: "Cancel Order"
    content: "Terminate an active transaction before fulfillment."
    keywords: ["order cancellation", "void transaction", "stop shipment", "kill order"]
    parameters:
      order_id: { type: "string" }
      reason: { type: "string", description: "Reason for cancellation provided by the customer." }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "update_order"
    title: "Update Order"
    content: "Modify shipment details or quantities for an unfulfilled transaction."
    keywords: ["order modification", "edit purchase", "change quantity", "adjust order"]
    parameters:
      order_id: { type: "string" }
      field: { type: "string", enum: ["quantity", "shipping_address", "product_id"] }
      new_value: { type: "string" }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "track_order"
    title: "Track Order"
    content: "Retrieve real-time logistics data and courier tracking updates."
    keywords: ["order tracking", "delivery status", "shipping logistics", "package location"]
    parameters:
      tracking_number: { type: "string" }
    metadata:
      source: "yaml"
      category: "logistics"
      provider: "internal"
      updated: "2025-04-07"

  - id: "process_refund"
    title: "Process Refund"
    content: "Execute a financial reversal for a returned item."
    keywords: ["billing refund", "payment reversal", "money back", "return credit"]
    parameters:
      order_id: { type: "string" }
      amount: { type: "number", description: "Amount to refund. Leave null for full refund." }
    metadata:
      source: "yaml"
      category: "billing"
      provider: "internal"
      updated: "2025-04-07"

  - id: "process_exchange"
    title: "Process Exchange"
    content: "Swap a purchase for a replacement item."
    keywords: ["item exchange", "product swap", "replacement sku", "trade item"]
    parameters:
      original_order_id: { type: "string" }
      new_product_id: { type: "string" }
    metadata:
      source: "yaml"
      category: "orders"
      provider: "internal"
      updated: "2025-04-07"

  - id: "email_customer"
    title: "Email Customer"
    content: "Dispatch an outbound electronic message to the customer."
    keywords: ["send email", "outbound message", "customer contact", "write customer"]
    parameters:
      customer_id: { type: "string" }
      subject: { type: "string" }
      body: { type: "string" }
    metadata:
      source: "yaml"
      category: "communication"
      provider: "internal"
      updated: "2025-04-07"

  - id: "notify_order_delay"
    title: "Notify Order Delay"
    content: "Alert the customer that their shipment is behind schedule."
    keywords: ["delay notification", "shipping alert", "late order warning", "backorder notice"]
    parameters:
      order_id: { type: "string" }
      estimated_days_delay: { type: "integer" }
    metadata:
      source: "yaml"
      category: "communication"
      provider: "internal"
      updated: "2025-04-07"

  - id: "apply_discount"
    title: "Apply Discount"
    content: "Attach a promo code or price reduction to a transaction."
    keywords: ["billing discount", "promo coupon", "price reduction", "add voucher"]
    parameters:
      order_id: { type: "string" }
      promo_code: { type: "string" }
    metadata:
      source: "yaml"
      category: "billing"
      provider: "internal"
      updated: "2025-04-07"

  - id: "escalate_ticket"
    title: "Escalate Ticket"
    content: "Transfer a high-priority support case to management."
    keywords: ["ticket escalation", "support tier", "manager review", "supervisor"]
    parameters:
      ticket_id: { type: "string" }
      priority: { type: "string", enum: ["high", "urgent", "critical"] }
    metadata:
      source: "yaml"
      category: "support"
      provider: "internal"
      updated: "2025-04-07"

  - id: "create_support_ticket"
    title: "Create Support Ticket"
    content: "Log a formal complaint or technical issue into the system."
    keywords: ["ticket creation", "helpdesk case", "support incident", "new ticket"]
    parameters:
      customer_id: { type: "string" }
      issue_category: { type: "string", enum: ["technical", "billing", "shipping", "general"] }
      description: { type: "string" }
    metadata:
      source: "yaml"
      category: "support"
      provider: "internal"
      updated: "2025-04-07"

  - id: "update_ticket_status"
    title: "Update Ticket Status"
    content: "Change the workflow state of an existing support case."
    keywords: ["ticket status change", "resolve incident", "close case", "finish ticket"]
    parameters:
      ticket_id: { type: "string" }
      status: { type: "string", enum: ["pending", "in_progress", "resolved", "closed"] }
    metadata:
      source: "yaml"
      category: "support"
      provider: "internal"
      updated: "2025-04-07"

  - id: "get_customer_interactions"
    title: "Get Customer Interactions"
    content: "View a timeline of all previous communications and logs."
    keywords: ["interaction logs", "comms history", "touchpoint timeline", "chat history"]
    parameters:
      customer_id: { type: "string" }
      limit: { type: "integer", default: 10 }
    metadata:
      source: "yaml"
      category: "crm"
      provider: "internal"
      updated: "2025-04-07"

  - id: "schedule_followup"
    title: "Schedule Follow-up"
    content: "Set a future reminder or callback appointment."
    keywords: ["crm followup", "callback schedule", "agent reminder", "plan call"]
    parameters:
      customer_id: { type: "string" }
      date_time: { type: "string", format: "date-time" }
    metadata:
      source: "yaml"
      category: "crm"
      provider: "internal"
      updated: "2025-04-07"

  - id: "get_pending_followups"
    title: "Get Pending Follow-ups"
    content: "Query the CRM for overdue or upcoming action items."
    keywords: ["pending tasks", "crm todo", "overdue followups"]
    parameters:
      agent_id: { type: "string" }
    metadata:
      source: "yaml"
      category: "crm"
      provider: "internal"
      updated: "2025-04-07"

  - id: "check_product_inventory"
    title: "Check Product Inventory"
    content: "Verify on-hand stock levels for a specific SKU."
    keywords: ["inventory check", "warehouse stock", "sku availability", "stock levels"]
    parameters:
      product_id: { type: "string" }
      warehouse_location: { type: "string", default: "all" }
    metadata:
      source: "yaml"
      category: "warehouse"
      provider: "internal"
      updated: "2025-04-07"

  - id: "recommend_product"
    title: "Recommend Product"
    content: "Suggest complementary items based on purchase history."
    keywords: ["marketing upsell", "product recommendation", "cross sell", "suggest items"]
    parameters:
      customer_id: { type: "string" }
      category_preference: { type: "string" }
    metadata:
      source: "yaml"
      category: "marketing"
      provider: "internal"
      updated: "2025-04-07"
