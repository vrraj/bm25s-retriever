[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrraj-bm25s-retriever"
version = "1.0.0"
description = "BM25S + PyStemmer-powered lexical retrieval (with stemming) and routing layer for LLM tools, documents, and hybrid RAG"
authors = [{name = "Raj Rajkumar"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

keywords = ["bm25", "bm25s", "retrieval", "lexical-search", "llm", "rag", "tool-routing", "hybrid-rag", "pystemmer", "fastapi"]

dependencies = [
    "bm25s>=0.3.2.post1",
    "PyStemmer>=3.0.0",
    "PyYAML>=6.0.3",
    "pydantic>=2.11.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/vrraj/bm25s-retriever"
Repository = "https://github.com/vrraj/bm25s-retriever"
Documentation = "https://vrraj.github.io/bm25s-retriever/"

[project.scripts]
bm25s-server = "bm25s_retriever.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bm25s_retriever*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
